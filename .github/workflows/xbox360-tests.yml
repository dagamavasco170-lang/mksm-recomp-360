name: Xbox 360 portable tests
on:
  push:
    branches: [xbox360/bootstrap]
    paths:
      - "port/xbox360/**"
      - "tools/tests/test_xbox_generated_fio_routing.py"
      - "ps2xRecomp/src/lib/function_table_emitter.cpp"
      - "port/xbox360/tests/ps2_generated_runtime_fio_dispatch_test.cpp"
      - "port/xbox360/tests/ps2_generated_runtime_ioman_bridge_test.cpp"
      - "port/xbox360/ps2_iop_ioman_trace_ring.h"
      - "port/xbox360/tests/ps2_iop_ioman_trace_ring_test.cpp"
      - "port/xbox360/ps2_resource_loading_runtime.h"
      - "port/xbox360/tests/ps2_resource_loading_runtime_test.cpp"
      - "tools/afs_inventory.py"
      - "tools/tests/test_afs_inventory.py"
      - "tools/ee_syscall_inventory.py"
      - "tools/tests/test_ee_syscall_inventory.py"
      - "tools/ee_syscall_mapping_audit.py"
      - "tools/tests/test_ee_syscall_mapping_audit.py"
      - "tools/ee_dispatch_table_extract.py"
      - "tools/tests/test_ee_dispatch_table_extract.py"
      - "ps2xRuntime/src/lib/Kernel/Syscalls/Dispatcher.cpp"
      - "games/mk-shaolin-monks/config/ee-syscall-dispatch.json"
      - "docs/xbox360/EE_SYSCALL_AUDIT.md"
      - "tools/afs_candidates.py"
      - "tools/tests/test_afs_candidates.py"
      - "tools/ioman_afs_correlate.py"
      - "tools/tests/test_ioman_afs_correlate.py"
      - "tools/afs_resource_profiler.py"
      - "tools/tests/test_afs_resource_profiler.py"
      - "docs/xbox360/AFS_RESOURCE_PROFILER.md"
      - "tools/afs_resource_intelligence.py"
      - "tools/afs_runtime_binding.py"
      - "tools/tests/test_afs_runtime_binding.py"
      - "tools/ioman_trace_log_extract.py"
      - "tools/tests/test_ioman_trace_log_extract.py"
      - "docs/xbox360/AFS_RUNTIME_BINDING.md"
      - "tools/tests/test_afs_resource_intelligence.py"
      - "docs/xbox360/AFS_RESOURCE_INTELLIGENCE.md"
      - "ps2xRecomp/src/lib/special_translator.cpp"
      - "ps2xRuntime/include/**"
      - "ps2xRuntime/src/lib/Kernel/**"
      - "ps2xTest/**"
      - "ps2xIOP/**"
      - ".github/workflows/xbox360-tests.yml"
  pull_request:
    branches: [main, xbox360/bootstrap]
    paths:
      - "port/xbox360/**"
      - "ps2xRecomp/src/lib/function_table_emitter.cpp"
      - "port/xbox360/tests/ps2_generated_runtime_fio_dispatch_test.cpp"
      - "port/xbox360/tests/ps2_generated_runtime_ioman_bridge_test.cpp"
      - "port/xbox360/ps2_iop_ioman_trace_ring.h"
      - "port/xbox360/tests/ps2_iop_ioman_trace_ring_test.cpp"
      - "tools/afs_inventory.py"
      - "tools/tests/test_afs_inventory.py"
      - "tools/ee_syscall_inventory.py"
      - "tools/tests/test_ee_syscall_inventory.py"
      - "tools/ee_syscall_mapping_audit.py"
      - "tools/tests/test_ee_syscall_mapping_audit.py"
      - "tools/ee_dispatch_table_extract.py"
      - "tools/tests/test_ee_dispatch_table_extract.py"
      - "ps2xRuntime/src/lib/Kernel/Syscalls/Dispatcher.cpp"
      - "games/mk-shaolin-monks/config/ee-syscall-dispatch.json"
      - "docs/xbox360/EE_SYSCALL_AUDIT.md"
      - "tools/afs_candidates.py"
      - "tools/tests/test_afs_candidates.py"
      - "tools/ioman_afs_correlate.py"
      - "tools/tests/test_ioman_afs_correlate.py"
      - "tools/afs_resource_profiler.py"
      - "tools/tests/test_afs_resource_profiler.py"
      - "docs/xbox360/AFS_RESOURCE_PROFILER.md"
      - "tools/afs_resource_intelligence.py"
      - "tools/tests/test_afs_resource_intelligence.py"
      - "docs/xbox360/AFS_RESOURCE_INTELLIGENCE.md"
      - "tools/afs_runtime_binding.py"
      - "tools/tests/test_ioman_trace_log_extract.py"
      - "tools/ioman_trace_log_extract.py"
      - "tools/tests/test_afs_runtime_binding.py"
      - "docs/xbox360/AFS_RUNTIME_BINDING.md"
      - "ps2xRuntime/include/**"
      - "ps2xRuntime/src/lib/Kernel/**"
      - "ps2xTest/**"
      - "ps2xIOP/**"
      - ".github/workflows/xbox360-tests.yml"
  workflow_dispatch:
concurrency:
  group: xbox360-tests-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runtime-host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop runtime build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config build-essential \
            libgl1-mesa-dev libasound2-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libxext-dev libxfixes-dev libxxf86vm-dev
      - name: Configure host runtime and regression suite
        run: |
          cmake -S . -B build/host-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPS2X_BUILD_RECOMP=ON \
            -DPS2X_BUILD_RUNTIME=ON \
            -DPS2X_BUILD_ANALYZER=ON \
            -DPS2X_BUILD_TEST=ON \
            -DPS2X_BUILD_STUDIO=OFF \
            -DPS2X_ENABLE_DEBUG_UI=OFF \
            -DPS2X_ENABLE_FFMPEG=OFF \
            -DPS2X_ENABLE_SCCACHE=OFF
      - name: Build PS2Runtime and focused FileIO regression suite
        run: cmake --build build/host-tests --target ps2x_runtime_io_tests --parallel 2
      - name: Run runtime FileIO regression suite
        run: ./build/host-tests/ps2xTest/ps2x_runtime_io_tests
  runtime-host-full-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop runtime build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config build-essential \
            libgl1-mesa-dev libasound2-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxinerama-dev libxext-dev libxfixes-dev libxxf86vm-dev
      - name: Configure complete host regression suite
        run: |
          cmake -S . -B build/host-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPS2X_BUILD_RECOMP=ON \
            -DPS2X_BUILD_RUNTIME=ON \
            -DPS2X_BUILD_ANALYZER=ON \
            -DPS2X_BUILD_TEST=ON \
            -DPS2X_BUILD_STUDIO=OFF \
            -DPS2X_ENABLE_DEBUG_UI=OFF \
            -DPS2X_ENABLE_FFMPEG=OFF \
            -DPS2X_ENABLE_SCCACHE=OFF
      - name: Build complete PS2 runtime regression suite
        run: cmake --build build/host-tests --target ps2x_tests --parallel 2
      - name: Run complete PS2 runtime regression suite
        run: ./build/host-tests/ps2xTest/ps2x_tests
  iop-fileio-rpc-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run PS2 FILEIO RPC service test
        run: |
          set -euo pipefail
          mkdir -p build/host-tests
          c++ -std=c++20 -Wall -Wextra -Werror \
            -Ips2xIOP/include -Ips2xIOP/src \
            ps2xIOP/src/modules/fileio.cpp ps2xIOP/tests/fileio_rpc_test.cpp \
            -o build/host-tests/fileio_rpc_test
          build/host-tests/fileio_rpc_test
  controller-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run controller tests
        run: |
          set -euo pipefail
          mkdir -p build/host-tests
          c++ -std=c++20 -Wall -Wextra -Werror -Ips2xRuntime/include -Iport/xbox360 \
            port/xbox360/tests/ps2_pad_xbox360_test.cpp port/xbox360/ps2_pad_mapping.cpp \
            -o build/host-tests/ps2_pad_xbox360_test
          build/host-tests/ps2_pad_xbox360_test
  afs-inventory-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run AFS inventory unit tests
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
  ee-core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run EE core tests
        run: |
          set -euo pipefail
          mkdir -p build/host-tests
          compile_run() {
            local name="$1"
            shift
            c++ -std=c++20 -Wall -Wextra -Werror "$@" -o "build/host-tests/$name"
            "build/host-tests/$name"
          }
          compile_run ps2_resource_loading_runtime_test -Iport/xbox360 port/xbox360/tests/ps2_resource_loading_runtime_test.cpp
          compile_run ps2_resource_afs_bridge_test -Iport/xbox360 port/xbox360/tests/ps2_resource_afs_bridge_test.cpp
          compile_run ps2_resource_afs_catalog_manager_test -Iport/xbox360 port/xbox360/tests/ps2_resource_afs_catalog_manager_test.cpp
          compile_run ps2_runtime_asset_resolver_test -Iport/xbox360 port/xbox360/tests/ps2_runtime_asset_resolver_test.cpp
          compile_run ps2_asset_service_test -Iport/xbox360 port/xbox360/tests/ps2_asset_service_test.cpp
          compile_run ps2_rdram_address_test -Iport/xbox360 port/xbox360/tests/ps2_rdram_address_test.cpp
          compile_run ps2_retail_disc_test -Iport/xbox360 port/xbox360/tests/ps2_retail_disc_test.cpp
          compile_run ps2_afs_archive_test -Iport/xbox360 port/xbox360/tests/ps2_afs_archive_test.cpp
          compile_run ps2_iop_retail_fileio_test -Iport/xbox360 port/xbox360/tests/ps2_iop_retail_fileio_test.cpp
          compile_run ps2_iop_afs_stream_test -Iport/xbox360 port/xbox360/tests/ps2_iop_afs_stream_test.cpp
          compile_run ps2_iop_afs_catalog_test -Iport/xbox360 port/xbox360/tests/ps2_iop_afs_catalog_test.cpp
          compile_run ps2_iop_ioman_test -Iport/xbox360 port/xbox360/tests/ps2_iop_ioman_test.cpp
          compile_run ps2_ioman_asset_service_integration_test -Iport/xbox360 port/xbox360/tests/ps2_ioman_asset_service_integration_test.cpp
          compile_run ps2_memory_region_test -Iport/xbox360 port/xbox360/tests/ps2_memory_region_test.cpp
          compile_run ps2_generated_abi_memory_test -Ips2xRuntime/include -Iport/xbox360/tests -Iport/xbox360 port/xbox360/tests/ps2_generated_abi_memory_test.cpp
          compile_run ps2_generated_runtime_ioman_bridge_test -Iport/xbox360/tests -Iport/xbox360 port/xbox360/tests/ps2_generated_runtime_ioman_bridge_test.cpp
          compile_run ps2_generated_runtime_ioman_ee_pointer_test -Iport/xbox360/tests -Iport/xbox360 port/xbox360/tests/ps2_generated_runtime_ioman_ee_pointer_test.cpp
          compile_run ps2_generated_runtime_fio_dispatch_test -Iport/xbox360/tests -Iport/xbox360 port/xbox360/tests/ps2_generated_runtime_fio_dispatch_test.cpp
          compile_run ps2_iop_ioman_trace_ring_test -Iport/xbox360 port/xbox360/tests/ps2_iop_ioman_trace_ring_test.cpp
          compile_run ps2_fio_ioman_adapter_test -Iport/xbox360/tests -Iport/xbox360 port/xbox360/tests/ps2_fio_ioman_adapter_test.cpp
          compile_run ps2_ee_ioman_syscall_dispatch_test -Iport/xbox360/tests -Iport/xbox360 port/xbox360/tests/ps2_ee_ioman_syscall_dispatch_test.cpp
          compile_run ps2_guest_memory_test -Iport/xbox360 port/xbox360/tests/ps2_guest_memory_test.cpp
          compile_run ps2_spr_dma_test -Iport/xbox360 port/xbox360/tests/ps2_spr_dma_test.cpp
          compile_run ps2_mmi_hilo_helpers_test -Ips2xRuntime/include port/xbox360/tests/ps2_mmi_hilo_helpers_test.cpp
          compile_run ps2_mmi_hilo_state_test -Iport/xbox360 port/xbox360/tests/ps2_mmi_hilo_state_test.cpp
          compile_run ps2_mmi_hilo_transfers_test -Iport/xbox360 port/xbox360/tests/ps2_mmi_hilo_transfers_test.cpp
          compile_run ps2_ee_cpu_state_test -Iport/xbox360 port/xbox360/tests/ps2_ee_cpu_state_test.cpp
          compile_run ps2_ee_instruction_decode_test -Iport/xbox360 port/xbox360/tests/ps2_ee_instruction_decode_test.cpp
          compile_run ps2_ee_special_executor_test -Iport/xbox360 port/xbox360/tests/ps2_ee_special_executor_test.cpp
          compile_run ps2_ee_special_coverage_test -Iport/xbox360 port/xbox360/tests/ps2_ee_special_coverage_test.cpp
          compile_run ps2_ee_mult_test -Iport/xbox360 port/xbox360/tests/ps2_ee_mult_test.cpp
          compile_run ps2_ee_div_test -Iport/xbox360 port/xbox360/tests/ps2_ee_div_test.cpp
          compile_run ps2_ee_load_store_executor_test -Iport/xbox360 port/xbox360/tests/ps2_ee_load_store_executor_test.cpp
          compile_run ps2_ee_branch_delay_test -Iport/xbox360 port/xbox360/tests/ps2_ee_branch_delay_test.cpp
          compile_run ps2_ee_cop0_test -Iport/xbox360 port/xbox360/tests/ps2_ee_cop0_test.cpp
          compile_run ps2_ee_dispatcher_test -Iport/xbox360 port/xbox360/tests/ps2_ee_dispatcher_test.cpp
          compile_run ps2_ee_mmi_executor_test -Iport/xbox360 port/xbox360/tests/ps2_ee_mmi_executor_test.cpp
          compile_run ps2_ee_test_program_test -Iport/xbox360 port/xbox360/tests/ps2_ee_test_program_test.cpp
          compile_run ps2_ee_immediate_executor_test -Iport/xbox360 port/xbox360/tests/ps2_ee_immediate_executor_test.cpp
  simd-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run SIMD tests
        run: |
          set -euo pipefail
          mkdir -p build/host-tests
          c++ -std=c++20 -Wall -Wextra -Werror -Iport/xbox360 \
            port/xbox360/tests/ps2_simd_scalar_test.cpp -o build/host-tests/ps2_simd_scalar_test
          build/host-tests/ps2_simd_scalar_test
          c++ -std=c++20 -Wall -Wextra -Werror -msse2 -Iport/xbox360 \
            port/xbox360/tests/ps2_simd_scalar_sse_oracle_test.cpp -o build/host-tests/ps2_simd_scalar_sse_oracle_test
          build/host-tests/ps2_simd_scalar_sse_oracle_test