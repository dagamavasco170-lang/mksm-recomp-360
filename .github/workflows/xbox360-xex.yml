name: Xbox 360 smoke XEX build

on:
  pull_request:
    branches: [main]
    paths:
      - "port/xbox360/**"
      - "ps2xRecomp/**"
      - "ps2xRuntime/include/**"
      - ".github/workflows/xbox360-xex.yml"
  workflow_dispatch:

concurrency:
  group: xbox360-xex-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-smoke-xex:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      XSDK_COMMIT: 9e6de98f6b5d737bce0fecd2864edae94bdd2637
    steps:
      - uses: actions/checkout@v4
      - name: Cache xSDK source and toolchain
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/xsdk
            ~/xsdk-gcc
          key: xsdk-ubuntu24-${{ env.XSDK_COMMIT }}
      - name: Install build prerequisites (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git
      - name: Clone pinned xSDK (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/xenosworks/xsdk.git "$HOME/xsdk"
          git -C "$HOME/xsdk" checkout "$XSDK_COMMIT"
      - name: Build toolchain (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd "$HOME/xsdk"
          PREFIX="$HOME/xsdk-gcc" WORK="$HOME/xsdk-gcc-work" JOBS="$(nproc)" bash tools/toolchain/build.sh
      - name: Build xSDK host tools/runtime
        run: cd "$HOME/xsdk" && make -j"$(nproc)"
      - name: Configure host PS2Recomp code-generation fixture
        run: |
          cmake -S . -B build/xbox360-codegen -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPS2X_BUILD_RUNTIME=OFF \
            -DPS2X_BUILD_ANALYZER=OFF \
            -DPS2X_BUILD_TEST=OFF \
            -DPS2X_BUILD_STUDIO=OFF \
            -DPS2X_BUILD_XBOX360_CODEGEN_PROBE=ON
      - name: Generate and execute desktop reference function
        run: cmake --build build/xbox360-codegen --target mksm_xbox360_codegen_probe mksm_xbox360_codegen_memory_probe --parallel 2
      - name: Execute generated EE function with Xenon memory ABI on host
        run: build/xbox360-codegen/ps2xRecomp/mksm_xbox360_codegen_memory_probe
      - name: Configure smoke target
        run: |
          cmake -S port/xbox360 -B build/xbox360 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/xsdk/cmake/xsdk.cmake" \
            -DXSDK_TOOLCHAIN="$HOME/xsdk-gcc" -DCMAKE_BUILD_TYPE=Release \
            -DMKSM_XBOX360_GENERATED_DIR="$GITHUB_WORKSPACE/build/xbox360-codegen/xbox360-codegen-probe/generated"
      - name: Build XEX
        run: cmake --build build/xbox360 --parallel
      - name: Upload smoke XEX
        uses: actions/upload-artifact@v4
        with:
          name: mksm-xbox360-smoke-xex
          path: build/xbox360/mksm_xbox360_smoke.xex
          if-no-files-found: error
          retention-days: 7
  xenia-emulator-smoke:
    needs: build-smoke-xex
    runs-on: windows-2022
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Download smoke XEX artifact
        uses: actions/download-artifact@v4
        with:
          name: mksm-xbox360-smoke-xex
          path: smoke
      - name: Download latest Xenia Canary (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/xenia-canary/xenia-canary/releases/latest/download/xenia_canary_windows.7z'
          Invoke-WebRequest -Uri $url -OutFile xenia.7z
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = 'C:\Program Files\7-Zip\7z.exe' }
          if (-not (Test-Path $sevenZip)) { throw '7-Zip was not found on the runner.' }
          & $sevenZip x xenia.7z '-oxenia' -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract Xenia Canary.' }
          $exe = Get-ChildItem xenia -Recurse -Filter xenia_canary.exe | Select-Object -First 1
          if (-not $exe) { throw 'xenia_canary.exe not found in downloaded archive.' }
          "XENIA_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Attempt to boot diagnostic XEX in Xenia (non-blocking experiment)
        id: emulator
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path emulator-logs | Out-Null
          $xex = (Resolve-Path 'smoke/mksm_xbox360_smoke.xex').Path
          $exe = $env:XENIA_EXE
          if (-not $exe -or -not (Test-Path $exe)) { throw 'Xenia executable path missing.' }
          'Attempting Xenia Canary launch on GitHub Windows runner; this runner may lack GPU support.' | Tee-Object emulator-logs/summary.txt
          $proc = Start-Process -FilePath $exe -ArgumentList @('--target', $xex) -WorkingDirectory (Split-Path $exe) -PassThru -RedirectStandardOutput (Join-Path $PWD 'emulator-logs/stdout.txt') -RedirectStandardError (Join-Path $PWD 'emulator-logs/stderr.txt')
          try {
            Wait-Process -Id $proc.Id -Timeout 45 -ErrorAction Stop
            $proc.Refresh()
            'Process exited before timeout. ExitCode=' + $proc.ExitCode | Add-Content emulator-logs/summary.txt
          } catch {
            'Timeout after 45s or process wait failure: ' + $_.Exception.Message | Add-Content emulator-logs/summary.txt
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem (Split-Path $exe) -Recurse -File -Filter '*.log' | ForEach-Object { Copy-Item $_.FullName emulator-logs -Force -ErrorAction SilentlyContinue }
          Get-ChildItem emulator-logs -Force | Format-Table Name,Length | Out-String | Add-Content emulator-logs/summary.txt
      - name: Upload Xenia logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xenia-emulator-smoke-logs
          path: emulator-logs
          if-no-files-found: warn
          retention-days: 7
