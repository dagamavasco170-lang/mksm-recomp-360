name: Xbox 360 PS2Recomp code-generation probe

on:
  push:
    branches: [xbox360/bootstrap]
    paths:
      - "port/xbox360/**"
      - "ps2xRecomp/**"
      - "ps2xRuntime/include/**"
      - "ps2xIOP/include/**"
      - ".github/workflows/xbox360-codegen.yml"
  pull_request:
    branches: [main, xbox360/bootstrap]
    paths:
      - "port/xbox360/**"
      - "ps2xRecomp/**"
      - "ps2xRuntime/include/**"
      - "ps2xIOP/include/**"
      - ".github/workflows/xbox360-codegen.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-ee-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure focused PS2Recomp build
        run: |
          cmake -S . -B build/xbox360-codegen -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPS2X_BUILD_RUNTIME=OFF \
            -DPS2X_BUILD_ANALYZER=OFF \
            -DPS2X_BUILD_TEST=OFF \
            -DPS2X_BUILD_STUDIO=OFF \
            -DPS2X_BUILD_XBOX360_CODEGEN_PROBE=ON
      - name: Generate and compile translated EE function
        run: |
          cmake --build build/xbox360-codegen --target mksm_xbox360_codegen_probe mksm_xbox360_codegen_memory_probe --parallel 2
      - name: Execute generated EE function on desktop reference runtime
        run: build/xbox360-codegen/ps2xRecomp/mksm_xbox360_codegen_probe
      - name: Execute generated EE function with Xenon memory ABI on host
        run: build/xbox360-codegen/ps2xRecomp/mksm_xbox360_codegen_memory_probe
